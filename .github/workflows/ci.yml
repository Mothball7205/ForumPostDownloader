name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bunx prettier --check src test
      - run: node --check dist/build.user.js
      - run: git diff --exit-code -- dist/build.user.js
